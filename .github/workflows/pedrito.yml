name: Deploy production

on:
  push:
    branches:
      - main

permissions:
  packages: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_CELL_NAME=${{ secrets.NEXT_PUBLIC_CELL_NAME }} \
            --build-arg NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }} \
            -f Dockerfile -t ghcr.io/${{ github.repository }}:latest .
          docker push ghcr.io/${{ github.repository }}:latest

  deploy:
    name: Desplegar en el VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Conectarse por SSH y desplegar
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_VPS }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PEDRITO }}
          port: 22
          script: |
            set -e
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            export LANDING_IMAGE="ghcr.io/${{ github.repository }}:latest"
            
            docker pull $LANDING_IMAGE
            cd /srv/projects/frontend-landing
            docker compose up -d --no-deps --force-recreate landing
            docker image prune -f
            echo "Despliegue completado con éxito: $(date)"